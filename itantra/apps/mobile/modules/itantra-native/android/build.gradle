apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "expo-module-gradle-plugin"

group = "expo.modules.itantranative"
version = "0.1.0"

android {
  namespace "expo.modules.itantranative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }

  // Compile the shared, pure-Kotlin engine directly from apps/android so the app and the JVM
  // tests use the exact same sources (packages/vectors is the formal contract for the codec).
  sourceSets {
    main {
      java.srcDirs += [
        "$rootDir/../../android/core-protocol/src/main/kotlin",
        "$rootDir/../../android/core-transport/src/main/kotlin",
        // Android-only transports (Bluetooth RFCOMM, Wi-Fi Direct) live in androidMain.
        "$rootDir/../../android/core-transport/src/androidMain/kotlin",
        "$rootDir/../../android/core-speech/src/main/kotlin",
        "$rootDir/../../android/engine-service/src/main/kotlin",
      ]
    }
  }

  lint {
    abortOnError false
  }
}

dependencies {
  // The shared core-protocol sources reference kotlinx-serialization only from their CLI main();
  // the runtime is enough, no compiler plugin is needed for the classes the app uses.
  implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0"
  // core-transport and core-speech use coroutines Flow.
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
}
